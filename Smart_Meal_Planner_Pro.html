<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Meal Planner Pro</title><style>body{font-family:Segoe UI,Arial;background:#f6f8f6;margin:0}header{background:#4CAF50;color:#fff;padding:24px}main{max-width:1200px;margin:auto;padding:20px}.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.08)}button{background:#4CAF50;color:#fff;border:none;padding:10px 16px;border-radius:8px}select,input{padding:8px;margin:8px}details{margin:8px 0;border:1px solid #ddd;padding:10px;border-radius:8px}</style></head><body><header><h1>🍽 Smart Meal Planner Pro</h1><p>Vollständige Rezepte für 2 Personen</p></header><main><div class="card">Tage <input id="days" type="number" value="7" min="1" max="14"> Kategorie <select id="cat"><option>Italienisch</option><option>Deutsch</option><option>Asiatisch</option><option>Schnell & Gesund</option></select><button onclick="generate()">Essensplan erstellen</button></div><div id="plan"></div><div class="card"><h2>Einkaufsliste</h2><ul id="shop"></ul></div></main><script>const db={Italienisch:[{n:'Spaghetti Carbonara',t:'25 Min',k:'750 kcal',i:['250g Spaghetti','125g Pancetta','2 Eier','40g Pecorino','Pfeffer'],s:['Pasta kochen','Pancetta knusprig braten','Eier mit Käse verrühren','Mit Pasta vermengen']},{n:'Lasagne Bolognese',t:'60 Min',k:'820 kcal',i:['250g Hackfleisch','1 Zwiebel','500ml Passata','6 Lasagneplatten','150g Käse'],s:['Hackfleisch anbraten','Sauce kochen','Schichten','35 Minuten backen']},{n:'Risotto Funghi',t:'35 Min',k:'680 kcal',i:['200g Risottoreis','250g Pilze','750ml Brühe','40g Parmesan'],s:['Pilze anbraten','Reis rösten','Brühe zugeben','Parmesan einrühren']},{n:'Penne Arrabbiata',t:'20 Min',k:'620 kcal',i:['250g Penne','400g Tomaten','2 Knoblauchzehen','Chili'],s:['Nudeln kochen','Sauce kochen','Vermengen']}] ,Deutsch:[{n:'Senfeier mit Kartoffeln',t:'30 Min',k:'620 kcal',i:['4 Eier','600g Kartoffeln','40g Butter','40g Mehl','500ml Milch','3 EL Senf'],s:['Kartoffeln kochen','Eier kochen','Senfsauce zubereiten','Servieren']},{n:'Frikadellen mit Püree',t:'40 Min',k:'790 kcal',i:['400g Hackfleisch','1 Ei','600g Kartoffeln','100ml Milch'],s:['Frikadellen formen','Braten','Püree herstellen']},{n:'Käsespätzle',t:'25 Min',k:'840 kcal',i:['400g Spätzle','200g Käse','2 Zwiebeln'],s:['Zwiebeln rösten','Spätzle schichten','Überbacken']},{n:'Kartoffelsuppe',t:'35 Min',k:'550 kcal',i:['600g Kartoffeln','1 Möhre','1 Zwiebel','1l Brühe'],s:['Gemüse würfeln','Kochen','Pürieren']}] ,Asiatisch:[{n:'Pad Thai',t:'30 Min',k:'700 kcal',i:['200g Reisnudeln','2 Eier','Gemüse','Erdnüsse'],s:['Nudeln einweichen','Gemüse braten','Alles vermengen']},{n:'Chicken Teriyaki',t:'25 Min',k:'680 kcal',i:['300g Hähnchen','Teriyakisauce','200g Reis'],s:['Reis kochen','Hähnchen braten','Sauce zufügen']},{n:'Thai Curry',t:'30 Min',k:'720 kcal',i:['400ml Kokosmilch','Gemüse','200g Reis'],s:['Gemüse anbraten','Kokosmilch zugeben','Mit Reis servieren']},{n:'Ramen',t:'35 Min',k:'650 kcal',i:['Ramen-Nudeln','Brühe','Ei','Frühlingszwiebeln'],s:['Brühe kochen','Nudeln garen','Anrichten']}] ,'Schnell & Gesund':[{n:'Quinoa Bowl',t:'20 Min',k:'520 kcal',i:['200g Quinoa','Gemüse','Feta'],s:['Quinoa kochen','Gemüse schneiden','Vermengen']},{n:'Protein Wraps',t:'15 Min',k:'580 kcal',i:['2 Wraps','250g Hähnchen','Salat'],s:['Hähnchen braten','Wraps füllen']},{n:'Shakshuka',t:'25 Min',k:'540 kcal',i:['4 Eier','400g Tomaten','Paprika'],s:['Sauce kochen','Eier stocken lassen']},{n:'Linsensalat',t:'20 Min',k:'500 kcal',i:['250g Linsen','Gemüse','Dressing'],s:['Linsen kochen','Vermengen']}]} ; function generate(){const d=+days.value;const arr=db[cat.value];let h='<div class="card"><h2>Essensplan</h2>';let shop=[];for(let x=0;x<d;x++){let r=arr[x%arr.length];shop.push(...r.i);h+=`<details><summary><b>Tag ${x+1}: ${r.n}</b> | ${r.t} | ${r.k}</summary><p><b>Zutaten für 2 Personen</b></p><ul>${r.i.map(v=>'<li>'+v+'</li>').join('')}</ul><p><b>Zubereitung</b></p><ol>${r.s.map(v=>'<li>'+v+'</li>').join('')}</ol></details>`;}h+='</div>';plan.innerHTML=h;shop.innerHTML='';document.getElementById('shop').innerHTML=[...new Set(shop)].map(v=>'<li>'+v+'</li>').join('');}</script></body></html>
